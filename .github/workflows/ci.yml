name: Build and test template

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      # Pinned: check-qa.py depends on the qa.json layout of this version.
      PUBLISHER_VERSION: 3.0.0
      PUBLISHER_SHA256: b8403abe5a438ddb9a3a07e02ad925f2c4bbbd9e903c49ecff50fcb481ec64ad
      BUNDLE_GEMFILE: ${{ github.workspace }}/.github/jekyll/Gemfile
      JEKYLL_NO_BUNDLER_REQUIRE: '1'
    steps:
      # Full history: scripts/build.py takes the mtime of the archive entries from the last commit
      # that changed package/.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      # The publisher runs `jekyll` from the PATH; the wrapper makes that run the locked gems.
      - name: Put Jekyll on the PATH
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/usr/bin/env bash\nexec bundle exec jekyll "$@"\n' > "$RUNNER_TEMP/bin/jekyll"
          chmod +x "$RUNNER_TEMP/bin/jekyll"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Fails when a base file that this template overrides is no longer the 0.1.0 version.
      - name: Check overridden base files
        run: node test/base-hashes.test.js

      - name: Test build script
        run: python3 test/build.test.py

      # Prints the sha-256; it must equal that of a local build of the same commit.
      - name: Build template package
        run: python3 scripts/build.py

      - name: Install template in the package cache
        run: scripts/install-local.sh

      - name: Download IG Publisher
        run: |
          mkdir -p test/sample-ig/input-cache
          curl -sSfL -o test/sample-ig/input-cache/publisher.jar \
            "https://github.com/HL7/fhir-ig-publisher/releases/download/${PUBLISHER_VERSION}/publisher.jar"
          echo "${PUBLISHER_SHA256}  test/sample-ig/input-cache/publisher.jar" | shasum -a 256 -c -

      - name: Build test IG
        working-directory: test/sample-ig
        run: java -jar input-cache/publisher.jar -ig .

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sample-ig-output
          path: |
            test/sample-ig/output/
            build/
          if-no-files-found: warn

      - name: Test language redirect
        run: node test/lang-redirects.test.js

      # Logo, Twiin CSS, release label, link to all IGs, footer, one <h2 id="root"> on the history
      # page, nld.svg in en/.
      - name: Test house style and fixes in the output
        run: node test/output.test.js

      # The publisher exits with 0 even when qa.html reports errors.
      # Page width and table layout at 390 px, in the Chrome of the runner image.
      - name: Test narrow screen layout
        run: node test/mobile.test.js

      - name: Fail on unknown errors in QA report
        run: python3 .github/scripts/check-qa.py
